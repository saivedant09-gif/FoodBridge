<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - My Allocations & Pickups</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-leaf"></i>
        <span>FoodBridge</span>
      </a>

      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="userDisplayName">Loading...</div>
        <div class="sidebar-user-role"><i class="fa-solid fa-hand-holding-heart me-1"></i>Food Recipient</div>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <a href="../dashboards/recipient-dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="available-food.html" class="nav-link">
            <i class="fa-solid fa-magnifying-glass"></i> Available Food
          </a>
        </li>
        <li class="nav-item">
          <a href="my-requests.html" class="nav-link">
            <i class="fa-solid fa-paper-plane"></i> My Requests
          </a>
        </li>
        <li class="nav-item">
          <a href="allocations.html" class="nav-link active">
            <i class="fa-solid fa-truck-pickup"></i> My Allocations
          </a>
        </li>
        <li class="nav-item">
          <a href="notifications.html" class="nav-link">
            <i class="fa-solid fa-bell"></i> Notifications
          </a>
        </li>
        <li class="nav-item">
          <a href="organization-profile.html" class="nav-link">
            <i class="fa-solid fa-building"></i> Profile
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title">
            <h1>Confirmed Allocations</h1>
            <p>Coordinate scheduled pickups and confirm collection arrival</p>
          </div>
        </div>
      </header>

      <div class="dashboard-content">
        <div id="alertContainer"></div>

        <div class="card card-custom">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Allocated Food</th>
                    <th>Provider & Location</th>
                    <th>Quantity</th>
                    <th>Pickup Deadline</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="allocationsTableBody">
                  <tr>
                    <td colspan="6" class="text-center py-5">
                      <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Common.initMobileSidebar();
      const user = await Auth.checkAuth();
      if (!user) return;
      if (!Auth.checkRole('RECIPIENT')) return;

      document.getElementById('userDisplayName').textContent = user.fullName || user.email;
      document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

      loadAllocations();
    });

    async function loadAllocations() {
      const tableBody = document.getElementById('allocationsTableBody');
      try {
        const res = await API.get('/allocations/me');
        const list = res.data || res;
        const allocations = Array.isArray(list) ? list : (list.content || []);

        if (allocations.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6">${Common.emptyState('No active food allocations found.')}</td></tr>`;
          return;
        }

        tableBody.innerHTML = allocations.map(item => `
          <tr>
            <td>
              <div class="fw-bold">${item.foodTitle || item.listingTitle || 'Food Donation'}</div>
              <small class="text-muted">ID: #${item.id}</small>
            </td>
            <td>
              <div>${item.providerName || item.organizationName || 'Provider'}</div>
              <small class="text-muted">${item.pickupAddress || 'Address on file'}</small>
            </td>
            <td><strong>${Common.formatQuantity(item.allocatedQuantity || item.quantity, item.unit)}</strong></td>
            <td class="small text-muted">${Common.formatDateTime(item.pickupDeadline)}</td>
            <td>${Common.statusBadge(item.status)}</td>
            <td class="text-end">
              ${(item.status === 'CONFIRMED' || item.status === 'APPROVED') ? `
                <button class="btn btn-sm btn-success me-1" onclick="confirmCollection(${item.id})">
                  <i class="fa-solid fa-check me-1"></i>Confirm Pickup
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="cancelAllocation(${item.id})">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              ` : `<span class="text-muted small">Completed</span>`}
            </td>
          </tr>
        `).join('');

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Failed to load allocations.</td></tr>`;
      }
    }

    async function confirmCollection(allocationId) {
      if (!confirm('Confirm that you have completed pickup of this allocation?')) return;
      try {
        await API.post(`/allocations/${allocationId}/collect`);
        Common.showAlert('Collection confirmed! Thank you for recovering food.', 'success');
        loadAllocations();
      } catch (err) {
        Common.showAlert(err.message || 'Failed to confirm pickup.', 'error');
      }
    }

    async function cancelAllocation(allocationId) {
      if (!confirm('Are you sure you want to cancel this allocation?')) return;
      try {
        await API.patch(`/allocations/${allocationId}/cancel`);
        Common.showAlert('Allocation cancelled.', 'warning');
        loadAllocations();
      } catch (err) {
        Common.showAlert(err.message || 'Failed to cancel allocation.', 'error');
      }
    }
  </script>
</body>
</html>
