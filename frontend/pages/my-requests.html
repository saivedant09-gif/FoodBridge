<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - My Food Requests</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-leaf"></i>
        <span>FoodBridge</span>
      </a>

      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="userDisplayName">Loading...</div>
        <div class="sidebar-user-role"><i class="fa-solid fa-hand-holding-heart me-1"></i>Food Recipient</div>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <a href="../dashboards/recipient-dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="available-food.html" class="nav-link">
            <i class="fa-solid fa-magnifying-glass"></i> Available Food
          </a>
        </li>
        <li class="nav-item">
          <a href="my-requests.html" class="nav-link active">
            <i class="fa-solid fa-paper-plane"></i> My Requests
          </a>
        </li>
        <li class="nav-item">
          <a href="allocations.html" class="nav-link">
            <i class="fa-solid fa-truck-pickup"></i> My Allocations
          </a>
        </li>
        <li class="nav-item">
          <a href="notifications.html" class="nav-link">
            <i class="fa-solid fa-bell"></i> Notifications
          </a>
        </li>
        <li class="nav-item">
          <a href="organization-profile.html" class="nav-link">
            <i class="fa-solid fa-building"></i> Profile
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title">
            <h1>My Requested Surplus</h1>
            <p>Track request statuses and responses from food providers</p>
          </div>
        </div>
      </header>

      <div class="dashboard-content">
        <div id="alertContainer"></div>

        <div class="card card-custom">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Requested Item</th>
                    <th>Provider</th>
                    <th>Quantity</th>
                    <th>Status</th>
                    <th>Requested On</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="requestsTableBody">
                  <tr>
                    <td colspan="6" class="text-center py-5">
                      <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Common.initMobileSidebar();
      const user = await Auth.checkAuth();
      if (!user) return;
      if (!Auth.checkRole('RECIPIENT')) return;

      document.getElementById('userDisplayName').textContent = user.fullName || user.email;
      document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

      loadMyRequests();
    });

    async function loadMyRequests() {
      const tableBody = document.getElementById('requestsTableBody');
      try {
        const res = await API.get('/requests/me');
        const list = res.data || res;
        const requests = Array.isArray(list) ? list : (list.content || []);

        if (requests.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6">${Common.emptyState('You have no surplus requests submitted yet.')}</td></tr>`;
          return;
        }

        tableBody.innerHTML = requests.map(req => `
          <tr>
            <td>
              <div class="fw-bold">${req.foodTitle || req.listingTitle || 'Food Item'}</div>
              <small class="text-muted">${req.notes || ''}</small>
            </td>
            <td>${req.providerName || req.organizationName || 'Provider'}</td>
            <td><strong>${Common.formatQuantity(req.quantity, req.unit)}</strong></td>
            <td>${Common.statusBadge(req.status)}</td>
            <td class="small text-muted">${Common.formatDateTime(req.createdAt)}</td>
            <td class="text-end">
              ${req.status === 'PENDING' ? `
                <button class="btn btn-sm btn-outline-danger" onclick="cancelRequest(${req.id})">
                  <i class="fa-solid fa-times me-1"></i>Cancel
                </button>
              ` : `<span class="text-muted small">No action</span>`}
            </td>
          </tr>
        `).join('');

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Failed to load requests.</td></tr>`;
      }
    }

    async function cancelRequest(id) {
      if (!confirm('Are you sure you want to cancel this request?')) return;
      try {
        await API.patch(`/requests/${id}/cancel`);
        Common.showAlert('Request cancelled.', 'success');
        loadMyRequests();
      } catch (err) {
        Common.showAlert(err.message || 'Failed to cancel request.', 'error');
      }
    }
  </script>
</body>
</html>
