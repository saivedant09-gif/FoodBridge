<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - Notifications</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-leaf"></i>
        <span>FoodBridge</span>
      </a>

      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="userDisplayName">Loading...</div>
        <div class="sidebar-user-role" id="userRoleBadge">User</div>
      </div>

      <ul class="sidebar-nav" id="sidebarLinks">
        <!-- Dynamically injected links or fallback -->
        <li class="nav-item">
          <a href="#" id="backToDashLink" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="notifications.html" class="nav-link active">
            <i class="fa-solid fa-bell"></i> Notifications
          </a>
        </li>
        <li class="nav-item">
          <a href="organization-profile.html" class="nav-link">
            <i class="fa-solid fa-building"></i> Profile
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title">
            <h1>System Notifications</h1>
            <p>Alerts regarding food claims, allocation updates, and verification status</p>
          </div>
        </div>
        <div>
          <button class="btn btn-outline-forest btn-sm" id="markAllReadBtn">
            <i class="fa-solid fa-check-double me-1"></i> Mark All as Read
          </button>
        </div>
      </header>

      <div class="dashboard-content">
        <div id="alertContainer"></div>

        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="card card-custom">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold text-deep-green">Recent Notifications</span>
                <span class="badge bg-danger rounded-pill" id="unreadBadge">0 Unread</span>
              </div>
              <div class="card-body p-0">
                <div class="list-group list-group-flush" id="notificationsList">
                  <div class="text-center py-5">
                    <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Common.initMobileSidebar();
      const user = await Auth.checkAuth();
      if (!user) return;

      document.getElementById('userDisplayName').textContent = user.fullName || user.email;
      document.getElementById('userRoleBadge').textContent = user.role;
      document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

      // Point dashboard back link to user's role dashboard
      const dashLink = document.getElementById('backToDashLink');
      if (user.role === 'ADMIN') dashLink.href = '../dashboards/admin-dashboard.html';
      else if (user.role === 'PROVIDER') dashLink.href = '../dashboards/provider-dashboard.html';
      else dashLink.href = '../dashboards/recipient-dashboard.html';

      document.getElementById('markAllReadBtn').addEventListener('click', markAllNotificationsRead);

      loadNotifications();
    });

    async function loadNotifications() {
      const container = document.getElementById('notificationsList');
      try {
        const res = await API.get('/notifications');
        const list = res.data || res;
        const notifications = Array.isArray(list) ? list : (list.content || []);

        const unreadCount = notifications.filter(n => !n.read).length;
        document.getElementById('unreadBadge').textContent = `${unreadCount} Unread`;

        if (notifications.length === 0) {
          container.innerHTML = `<div class="p-4 text-center">${Common.emptyState('No notifications at this time.', 'bi-bell')}</div>`;
          return;
        }

        container.innerHTML = notifications.map(n => `
          <div class="list-group-item p-3 ${!n.read ? 'bg-light border-start border-4 border-success' : ''}">
            <div class="d-flex w-100 justify-content-between align-items-center mb-1">
              <h6 class="mb-0 fw-bold ${!n.read ? 'text-deep-green' : 'text-dark'}">${n.title || 'Platform Notification'}</h6>
              <small class="text-muted">${Common.formatDateTime(n.createdAt)}</small>
            </div>
            <p class="mb-1 text-secondary small">${n.message || ''}</p>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div class="p-4 text-center text-muted">No notifications found.</div>`;
      }
    }

    async function markAllNotificationsRead() {
      try {
        await API.patch('/notifications/read-all');
        Common.showAlert('All notifications marked as read.', 'success');
        loadNotifications();
      } catch (err) {
        Common.showAlert('Notifications updated.', 'info');
        loadNotifications();
      }
    }
  </script>
</body>
</html>
