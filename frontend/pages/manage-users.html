<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - Manage Users & Organizations</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-leaf"></i>
        <span>FoodBridge</span>
      </a>

      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="userDisplayName">Loading...</div>
        <div class="sidebar-user-role"><i class="fa-solid fa-shield-halved me-1"></i>Platform Admin</div>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <a href="../dashboards/admin-dashboard.html" class="nav-link">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="manage-users.html" class="nav-link active">
            <i class="fa-solid fa-users"></i> Users & Orgs
          </a>
        </li>
        <li class="nav-item">
          <a href="impact-dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-pie"></i> Analytics & Impact
          </a>
        </li>
        <li class="nav-item">
          <a href="notifications.html" class="nav-link">
            <i class="fa-solid fa-bell"></i> Notifications
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title">
            <h1>User & Organization Management</h1>
            <p>Administer registered user accounts, role permissions, and access status</p>
          </div>
        </div>
      </header>

      <div class="dashboard-content">
        <div id="alertContainer"></div>

        <div class="card card-custom">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold text-deep-green">Registered Platform Users</h6>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>User / Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Organization</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <tr>
                    <td colspan="6" class="text-center py-5">
                      <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Common.initMobileSidebar();
      const user = await Auth.checkAuth();
      if (!user) return;
      if (!Auth.checkRole('ADMIN')) return;

      document.getElementById('userDisplayName').textContent = user.fullName || user.email;
      document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

      loadUsers();
    });

    async function loadUsers() {
      const tableBody = document.getElementById('usersTableBody');
      try {
        const res = await API.get('/admin/users');
        const list = res.data || res;
        const users = Array.isArray(list) ? list : (list.content || []);

        if (users.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6">${Common.emptyState('No users found.')}</td></tr>`;
          return;
        }

        tableBody.innerHTML = users.map(u => `
          <tr>
            <td>
              <div class="fw-bold">${u.fullName || 'User'}</div>
              <small class="text-muted">ID: ${u.id || u.userId}</small>
            </td>
            <td>${u.email}</td>
            <td><span class="badge bg-light text-dark border">${u.role}</span></td>
            <td>${u.organizationName || 'N/A'}</td>
            <td>
              ${u.enabled !== false ? '<span class="badge bg-success">ACTIVE</span>' : '<span class="badge bg-danger">SUSPENDED</span>'}
            </td>
            <td class="text-end">
              ${u.role !== 'ADMIN' ? `
                <button class="btn btn-sm ${u.enabled !== false ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="toggleUserStatus(${u.id || u.userId}, ${u.enabled !== false})">
                  ${u.enabled !== false ? '<i class="fa-solid fa-user-slash me-1"></i>Suspend' : '<i class="fa-solid fa-user-check me-1"></i>Activate'}
                </button>
              ` : '<span class="text-muted small">Protected</span>'}
            </td>
          </tr>
        `).join('');

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Failed to load platform users.</td></tr>`;
      }
    }

    async function toggleUserStatus(userId, isCurrentlyActive) {
      const action = isCurrentlyActive ? 'suspend' : 'activate';
      if (!confirm(`Are you sure you want to ${action} this user?`)) return;

      try {
        await API.patch(`/admin/users/${userId}/${action}`);
        Common.showAlert(`User successfully ${action}ed.`, 'success');
        loadUsers();
      } catch (err) {
        Common.showAlert(err.message || `Failed to ${action} user.`, 'error');
      }
    }
  </script>
</body>
</html>
