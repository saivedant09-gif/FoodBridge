<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - Sign In</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-mint d-flex align-items-center justify-content-center py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5 col-xl-4">
        
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <h2 class="fw-bold text-deep-green d-inline-flex align-items-center gap-2">
              <i class="fa-solid fa-leaf text-amber"></i> FoodBridge
            </h2>
          </a>
          <p class="text-muted small">Surplus Food Redistribution Platform</p>
        </div>

        <div class="form-card">
          <div class="form-header text-start mb-4">
            <h3 class="fw-bold text-deep-green mb-1">Sign In</h3>
            <p class="text-muted small mb-0">Enter your credentials to access your account</p>
          </div>

          <div id="alertContainer"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" class="form-control" id="email" required placeholder="name@organization.org">
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label mb-0">Password</label>
              </div>
              <div class="input-group password-field-wrap">
                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
                <button type="button" class="password-toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                  <i class="fa-solid fa-eye" id="toggleIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-form-submit mt-3" id="submitBtn">
              <span id="btnText">Sign In</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
            </button>
          </form>

          <div class="auth-switch-link">
            Don't have an account? <a href="register.html">Register here</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    toggleBtn.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
      toggleIcon.classList.toggle('fa-eye');
      toggleIcon.classList.toggle('fa-eye-slash');
    });

    // Check query params for registration success notice
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      Common.showAlert('Registration successful! Please sign in with your credentials.', 'success');
    }

    // Login submit
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      btnSpinner.classList.remove('d-none');
      btnText.textContent = 'Signing in...';

      try {
        const response = await API.post('/auth/login', { email, password });
        const user = response.data || response;
        Auth.setCurrentUser(user);
        
        Common.showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          Auth.redirectByRole(user.role);
        }, 600);
      } catch (err) {
        Common.showAlert(err.message || 'Login failed. Please check your credentials.', 'error');
        submitBtn.disabled = false;
        btnSpinner.classList.add('d-none');
        btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
