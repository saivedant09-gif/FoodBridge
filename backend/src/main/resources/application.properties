# =========================================================
# FoodBridge Application Configuration
# DO NOT commit real secrets. Use environment variables.
# =========================================================

spring.application.name=FoodBridge

# ---- Server ----
server.port=${APP_PORT:8080}

# ---- MySQL (Primary Database) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foodbridge}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Do NOT use spring.jpa (we use JdbcTemplate only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ---- MongoDB (Supplementary — optional) ----
# If MONGO_ENABLED=false or MongoDB is unavailable, core workflows continue using MySQL.
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:foodbridge_meta}
# Disable MongoDB auto-config if not enabled — set MONGO_ENABLED=false
foodbridge.mongodb.enabled=${MONGO_ENABLED:false}

# ---- Session ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- Logging ----
logging.level.com.foodbridge=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc.core=DEBUG

# ---- Jackson ----
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
