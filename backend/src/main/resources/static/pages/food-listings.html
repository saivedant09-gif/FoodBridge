<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBridge - My Listings</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="sidebar-backdrop"></div>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-brand">
        <i class="fa-solid fa-leaf"></i>
        <span>FoodBridge</span>
      </a>

      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="userDisplayName">Loading...</div>
        <div class="sidebar-user-role"><i class="fa-solid fa-store me-1"></i>Food Provider</div>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item">
          <a href="../dashboards/provider-dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-line"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="food-listings.html" class="nav-link active">
            <i class="fa-solid fa-list-check"></i> My Listings
          </a>
        </li>
        <li class="nav-item">
          <a href="create-listing.html" class="nav-link">
            <i class="fa-solid fa-plus-circle"></i> Create Listing
          </a>
        </li>
        <li class="nav-item">
          <a href="notifications.html" class="nav-link">
            <i class="fa-solid fa-bell"></i> Notifications
          </a>
        </li>
        <li class="nav-item">
          <a href="organization-profile.html" class="nav-link">
            <i class="fa-solid fa-building"></i> Profile
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
          <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <header class="dashboard-header">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-title">
            <h1>My Food Listings</h1>
            <p>Manage and track the surplus donations you have created</p>
          </div>
        </div>
        <div>
          <a href="create-listing.html" class="btn btn-primary-forest">
            <i class="fa-solid fa-plus me-2"></i>New Listing
          </a>
        </div>
      </header>

      <div class="dashboard-content">
        <div id="alertContainer"></div>

        <!-- Filter Bar -->
        <div class="card card-custom p-3 mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-5">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" class="form-control" id="searchFilter" placeholder="Search by food name or notes...">
              </div>
            </div>
            <div class="col-md-4">
              <select class="form-select" id="statusFilter">
                <option value="">All Statuses</option>
                <option value="ACTIVE">ACTIVE</option>
                <option value="PENDING">PENDING</option>
                <option value="FULFILLED">FULFILLED</option>
                <option value="EXPIRED">EXPIRED</option>
                <option value="CANCELLED">CANCELLED</option>
              </select>
            </div>
            <div class="col-md-3 text-md-end">
              <button class="btn btn-outline-forest w-100" id="applyFiltersBtn">
                <i class="fa-solid fa-filter me-1"></i> Apply Filter
              </button>
            </div>
          </div>
        </div>

        <!-- Listings Table -->
        <div class="card card-custom">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Food Name</th>
                    <th>Category</th>
                    <th>Total Qty</th>
                    <th>Available</th>
                    <th>Expires</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="listingsTableBody">
                  <tr>
                    <td colspan="7" class="text-center py-5">
                      <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <!-- Pagination -->
          <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center py-3">
            <span class="text-muted small" id="pageInfo">Showing page 1</span>
            <div class="btn-group">
              <button class="btn btn-sm btn-outline-secondary" id="prevPageBtn" disabled>
                <i class="fa-solid fa-chevron-left me-1"></i> Prev
              </button>
              <button class="btn btn-sm btn-outline-secondary" id="nextPageBtn" disabled>
                Next <i class="fa-solid fa-chevron-right ms-1"></i>
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    let currentPage = 0;
    const pageSize = CONFIG.DEFAULT_PAGE_SIZE;

    document.addEventListener('DOMContentLoaded', async () => {
      Common.initMobileSidebar();
      const user = await Auth.checkAuth();
      if (!user) return;
      if (!Auth.checkRole('PROVIDER')) return;

      document.getElementById('userDisplayName').textContent = user.fullName || user.email;
      document.getElementById('logoutBtn').addEventListener('click', Auth.logout);

      document.getElementById('applyFiltersBtn').addEventListener('click', () => {
        currentPage = 0;
        fetchListings();
      });

      document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 0) {
          currentPage--;
          fetchListings();
        }
      });

      document.getElementById('nextPageBtn').addEventListener('click', () => {
        currentPage++;
        fetchListings();
      });

      fetchListings();
    });

    async function fetchListings() {
      const tableBody = document.getElementById('listingsTableBody');
      const status = document.getElementById('statusFilter').value;
      const search = document.getElementById('searchFilter').value.trim();

      tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm text-success"></div></td></tr>`;

      try {
        let endpoint = `/provider/listings?page=${currentPage}&size=${pageSize}`;
        if (status) endpoint += `&status=${encodeURIComponent(status)}`;
        if (search) endpoint += `&search=${encodeURIComponent(search)}`;

        const res = await API.get(endpoint);
        const pageData = res.data || res;
        const items = Array.isArray(pageData) ? pageData : (pageData.content || []);
        const totalPages = pageData.totalPages || 1;

        if (items.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="7">${Common.emptyState('No listings match your search criteria.')}</td></tr>`;
        } else {
          tableBody.innerHTML = items.map(item => `
            <tr>
              <td>
                <div class="fw-bold">${item.title || item.foodName}</div>
                <small class="text-muted">${item.dietaryFlags || ''}</small>
              </td>
              <td><span class="badge-category">${item.category || 'General'}</span></td>
              <td>${Common.formatQuantity(item.totalQuantity ?? item.quantity, item.unit)}</td>
              <td><strong>${Common.formatQuantity(item.availableQuantity, item.unit)}</strong></td>
              <td class="small text-muted">${Common.formatDateTime(item.expiresAt)}</td>
              <td>${Common.statusBadge(item.status)}</td>
              <td class="text-end">
                ${item.status === 'ACTIVE' ? `
                  <button class="btn btn-sm btn-outline-danger" onclick="cancelListing(${item.id})">
                    <i class="fa-solid fa-ban me-1"></i>Cancel
                  </button>
                ` : `<span class="text-muted small">No actions</span>`}
              </td>
            </tr>
          `).join('');
        }

        document.getElementById('pageInfo').textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
        document.getElementById('prevPageBtn').disabled = currentPage <= 0;
        document.getElementById('nextPageBtn').disabled = currentPage >= (totalPages - 1);

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">Could not load food listings.</td></tr>`;
      }
    }

    async function cancelListing(id) {
      if (!confirm('Are you sure you want to cancel this listing?')) return;
      try {
        await API.patch(`/listings/${id}/cancel`);
        Common.showAlert('Listing cancelled successfully.', 'success');
        fetchListings();
      } catch (err) {
        Common.showAlert(err.message || 'Failed to cancel listing.', 'error');
      }
    }
  </script>
</body>
</html>
